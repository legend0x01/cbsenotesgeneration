    <g stroke="url(#ink)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M140 238 C 170 234 196 238 220 248"/>
      <path d="M140 276 C 170 272 196 276 220 286"/>
      <path d="M140 314 C 166 311 186 313 204 320"/>
      <path d="M292 248 C 316 238 342 234 372 238"/>
      <path d="M292 286 C 316 276 342 272 372 276"/>
    </g>
  </g>

  <!-- AI sparkles -->
  <path d="M382 72 C 388 104 398 114 430 120 C 398 126 388 136 382 168 C 376 136 366 126 334 120 C 366 114 376 104 382 72 Z" fill="#ffffff"/>
  <path d="M318 96 C 321 110 325 114 339 117 C 325 120 321 124 318 138 C 315 124 311 120 297 117 C 311 114 315 110 318 96 Z" fill="#ffffff" fill-opacity="0.85"/>
